<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hora de Aventura — Projeto Individual</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Hora de Aventura — Projeto Individual</h1>
        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
            <a href="cadastro.html" aria-current="page">Cadastro</a>
            <a href="login.html">Login</a>
        </nav>
    </header>
    <main>
        <h2>Cadastro</h2>
        <p class="aviso" id="aviso-cadastro">
            Integração pendente: esta tela ainda não envia nem salva dados.
            O cadastro está desabilitado. Não preencha dados reais nesta etapa.
        </p>
        <!-- Sem envio: os campos são apenas a preparação visual do cadastro. -->
        <form aria-describedby="aviso-cadastro" onsubmit="return false;">
            <label for="nome">Nome</label>
            <input id="nome" type="text" autocomplete="name">

            <label for="email">E-mail</label>
            <input id="email" type="email" autocomplete="email">

            <label for="senha">Senha</label>
            <input id="senha" type="password" autocomplete="new-password">

            <label for="confirmacao-senha">Confirme a senha</label>
            <input id="confirmacao-senha" type="password" autocomplete="new-password">

            <button type="submit" disabled>Cadastrar (em breve)</button>
        </form>
        <p>Já tem uma conta? <a href="login.html">Ir para o login</a>.</p>
    </main>
    <footer>
        <p>Projeto individual de Patrick Scaglia — SPTech.</p>
    </footer>
</body>
</html>
